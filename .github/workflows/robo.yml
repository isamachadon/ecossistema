# robo.yml: o robô naturalista.
# A cada hora ele avança o planeta 1 dia e publica o site no GitHub Pages.
# O "save" do mundo fica numa gaveta separada (o branch "estado"), que é
# substituída a cada hora, pra o histórico do projeto não engordar.

name: Robo naturalista

on:
  schedule:
    - cron: "17 * * * *"   # todo minuto 17 de cada hora (o GitHub às vezes atrasa uns minutinhos)
  workflow_dispatch:        # cria o botão "Run workflow", pra rodar na mão
  push:
    branches: [main]        # quando você muda o site ou os nomes, ele republica (sem avançar o dia)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:                # nunca roda duas vezes ao mesmo tempo
  group: robo-naturalista
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Pegar o projeto
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abrir a gaveta "estado" (o save do mundo)
        run: |
          mkdir -p dados
          if git ls-remote --exit-code --heads origin estado; then
            git fetch --depth=1 origin estado
            git show FETCH_HEAD:estado.json > dados/estado.json
            git show FETCH_HEAD:diario.json > site/diario.json
          fi

      - name: Avançar o planeta 1 dia
        if: github.event_name != 'push'
        run: python simulacao/avancar.py

      - name: Guardar o save de volta na gaveta
        if: github.event_name != 'push'
        run: |
          mkdir gaveta
          cp dados/estado.json site/diario.json gaveta/
          cd gaveta
          git init -q -b estado
          git config user.name "robo-naturalista"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Mundo atualizado"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" estado

      - name: Preparar o site
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar o site
        id: publicar
        uses: actions/deploy-pages@v4
